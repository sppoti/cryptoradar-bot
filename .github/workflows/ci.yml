name: CI / Automated Test Suite

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax and compile bytecode
        run: |
          python -m compileall -q .

      - name: Run Context7 documentation tool tests
        run: |
          python -m unittest test_context7_docs.py -v

      - name: Run Canva visual asset & banner integration tests
        run: |
          python tools/test_canva_setup.py

      - name: Run Unified SaaS platform test suite
        env:
          BOT_TOKEN: "ci_dummy_token_123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
          ADMIN_ID: "12345678"
          PROJECT_NAME: "CryptoRadar Pro SaaS CI"
          VIP_LINK: "https://t.me/+dummy_vip_invite"
        run: |
          python test_saas_suite.py
